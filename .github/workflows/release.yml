# Publication d'une version : pousser une étiquette « vX.Y.Z » (git tag v0.2.0 && git push origin v0.2.0).
#  1. vérifie que l'étiquette correspond à la version de package.json et de l'agent ;
#  2. compile l'agent Rust (Linux statique x86_64 et aarch64 ; Windows x64 ; macOS aarch64 et x86_64, expérimental) ;
#  3. crée la release GitHub : archive de Corvus, binaires de l'agent, empreintes SHA-256, notes du CHANGELOG ;
#  4. publie l'image Docker multi-architecture (amd64 + arm64) dans le registre GitHub (ghcr.io).
# Aucun secret à configurer : tout passe par le GITHUB_TOKEN du dépôt.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          agent=$(grep -m1 '^version' agent/Cargo.toml | cut -d'"' -f2)
          echo "étiquette=$version  package.json=$pkg  agent=$agent"
          [ "$version" = "$pkg" ] || { echo "::error::l'étiquette ($version) ne correspond pas à package.json ($pkg)"; exit 1; }
          [ "$version" = "$agent" ] || { echo "::error::l'étiquette ($version) ne correspond pas à agent/Cargo.toml ($agent)"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md n'a pas de section [$version]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  agent:
    needs: verifier
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked
      - name: Compiler l'agent
        working-directory: agent
        run: cross build --release --target ${{ matrix.target }}
      - name: Nommer le binaire
        shell: bash
        run: |
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          cp "agent/target/${{ matrix.target }}/release/corvus-agent" "corvus-agent-${{ needs.verifier.outputs.version }}-linux-${arch}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-${{ matrix.target }}
          path: corvus-agent-*
          if-no-files-found: error

  agent-windows:
    # Jalon 1.2 : binaire Windows x64 (MSVC). Testé avant d'être publié ; nommé corvus-agent-<version>-windows-x86_64.exe
    # (c'est ce nom EXACT que cherche install.ps1 dans SHA256SUMS).
    needs: verifier
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
        with:
          targets: x86_64-pc-windows-msvc
      - name: Tests puis compilation
        working-directory: agent
        shell: bash
        run: |
          cargo test --target x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
      - name: Nommer le binaire
        shell: bash
        run: cp agent/target/x86_64-pc-windows-msvc/release/corvus-agent.exe "corvus-agent-${{ needs.verifier.outputs.version }}-windows-x86_64.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-windows
          path: corvus-agent-*
          if-no-files-found: error

  agent-macos:
    # Jalon 1.2 : binaires macOS (Apple Silicon et Intel), EXPÉRIMENTAUX : testés sur un runner, jamais sur un Mac réel.
    # Non signés : macOS les met en quarantaine à l'ouverture (voir les notes de version).
    needs: verifier
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, arch: aarch64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
        with:
          targets: ${{ matrix.target }}
      - name: Tests puis compilation
        working-directory: agent
        run: |
          cargo test --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
      - name: Nommer le binaire
        run: cp "agent/target/${{ matrix.target }}/release/corvus-agent" "corvus-agent-${{ needs.verifier.outputs.version }}-macos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-macos-${{ matrix.arch }}
          path: corvus-agent-*
          if-no-files-found: error

  publier:
    needs: [verifier, agent, agent-windows, agent-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-*
          merge-multiple: true
          path: dist
      - name: Archive de Corvus (sans les tests ni la CI)
        shell: bash
        run: |
          v="${{ needs.verifier.outputs.version }}"
          git ls-files -z | grep -zv -e '^test/' -e '^\.github/' -e '^test-results/' \
            | tar --null -T - --transform "s,^,corvus-$v/," -czf "dist/corvus-$v.tar.gz"
          chmod +x dist/corvus-agent-*
          (cd dist && sha256sum corvus-* > SHA256SUMS && cat SHA256SUMS)
      - name: Notes de version (extrait du CHANGELOG)
        shell: bash
        run: |
          v="${{ needs.verifier.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::notes vides pour $v"; exit 1; }
          cat >> notes.md <<NOTES

          ### Téléchargements
          - \`corvus-$v.tar.gz\` : Corvus (Node.js 22.13+) ; \`sudo ./deploy/install-linux.sh\` après extraction.
          - \`corvus-agent-$v-linux-x86_64\` et \`-aarch64\` : agent facultatif (binaire statique).
          - \`corvus-agent-$v-windows-x86_64.exe\` : agent Windows (installez-le avec \`install.ps1\`, qui vérifie son empreinte).
          - \`corvus-agent-$v-macos-aarch64\` et \`-x86_64\` : agent macOS, **EXPÉRIMENTAL** (jamais essayé sur un Mac réel) et **non signé**.
          - Image Docker : \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/corvus:$v\` (amd64 et arm64).
          - \`SHA256SUMS\` : \`sha256sum -c SHA256SUMS\` pour vérifier les fichiers.
          NOTES
      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v="${{ needs.verifier.outputs.version }}"
          gh release create "v$v" dist/* --title "Corvus $v" --notes-file notes.md --verify-tag

  image:
    needs: verifier
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nom
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/corvus" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.verifier.outputs.version }}
          tags: |
            ${{ steps.nom.outputs.image }}:${{ needs.verifier.outputs.version }}
            ${{ steps.nom.outputs.image }}:latest
