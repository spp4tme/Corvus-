# Intégration continue : à chaque push et pull request.
#  - tests Node (unitaires, bout en bout avec le sshd de test, interface avec Chrome) sur
#    x86_64 et ARM64 (même architecture qu'un Raspberry Pi 4/5) ;
#  - tests contre un VRAI OpenSSH (test/real-ssh.test.js) sur x86_64 ;
#  - agent Rust (étape 1) : compilé pour x86_64 et aarch64 dès que agent/Cargo.toml existe.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm : runners ARM64 gratuits pour les dépôts publics.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:pure
      # L'agent Rust est compilé AVANT les tests : sinon les tests d'interopérabilité (vrai binaire contre vrai serveur)
      # sont ignorés. Les runners GitHub ont sudo sans mot de passe : la prévisualisation (agent root) est testée aussi.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
      - name: Compiler l'agent (tests d'interopérabilité)
        working-directory: agent
        run: cargo build
      - name: Tests (unitaires, e2e, interface)
        env:
          CORVUS_TEST_BROWSER: chrome
        shell: bash
        # Les journaux GitHub demandent une connexion ; les annotations ::error:: sont lisibles par tous.
        run: |
          set +e
          npm test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then (grep -E "Error|expected|actual|panicked|ENOENT|not found|waiting for|ui.test.js|locator" test.log | grep -v "^\s*✖" | head -15; grep -E "^\s*✖" test.log | head -5) | while IFS= read -r l; do echo "::error::${l:0:400}"; done; fi
          exit $code
      - name: Captures d'écran des tests d'interface
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  qualite:
    # Vérifications de sécurité et de qualité : dépendances (npm, cargo) et lints Rust sans avertissement.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dépendances npm de production (vulnérabilités hautes ou critiques)
        run: npm audit --omit=dev --audit-level=high
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
        with:
          components: clippy
      - name: Lints Rust sans avertissement
        working-directory: agent
        run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit
      - name: Dépendances Rust (RustSec)
        working-directory: agent
        run: cargo audit

  real-openssh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: OpenSSH local avec un compte de test (mot de passe, sudo sans mot de passe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo useradd -m -s /bin/bash corvustest
          echo 'corvustest:Test-Passw0rd!' | sudo chpasswd
          echo 'corvustest ALL=(root) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/corvustest >/dev/null
          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/00-corvus.conf >/dev/null
          sudo systemctl restart ssh
      - name: Tests contre OpenSSH réel
        env:
          CORVUS_REAL_SSH: '127.0.0.1:22:corvustest:Test-Passw0rd!'
        run: node --test test/real-ssh.test.js

  agent:
    # Étape 1 (à faire sur le Pi) : les étapes s'activent toutes seules quand agent/Cargo.toml existe.
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        run: |
          if [ -f agent/Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "Pas encore d'agent, rien à compiler."; fi
      - if: steps.check.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
        with:
          targets: ${{ matrix.target }}
      - if: steps.check.outputs.present == 'true'
        run: cargo install cross --locked
      - name: Tests et compilation
        if: steps.check.outputs.present == 'true'
        working-directory: agent
        shell: bash
        run: |
          set +e
          cross test --target ${{ matrix.target }} 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then grep -E "^error|panicked|FAILED|failed|left|right|assert" test.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit $code; fi
          cross build --release --target ${{ matrix.target }}
      - if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corvus-agent-${{ matrix.target }}
          path: agent/target/${{ matrix.target }}/release/corvus-agent
          if-no-files-found: warn

  agent-os:
    # Jalon 1.2 : l'agent est COMPILÉ ET TESTÉ sur Windows et macOS (le test Linux est le job « agent » ci-dessus).
    # macOS reste EXPÉRIMENTAL : ce job prouve que ça compile et que les tests passent sur un runner, pas que ça marche sur un Mac réel.
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 : x86_64-pc-windows-msvc ; macos-15 : Apple Silicon (aarch64) ; macos-15-intel : x86_64.
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche « stable »
      - name: Tests de l'agent (cargo test)
        working-directory: agent
        shell: bash
        # Les journaux GitHub demandent une connexion ; les annotations ::error:: sont lisibles par tous. On y met les
        # erreurs de compilation (message + fichier:ligne) puis les tests en échec, pour corriger sans accès aux journaux.
        run: |
          set +e
          cargo test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            awk '/^error(\[E[0-9]+\])?:/ && !/could not compile/ {msg=$0; next} /^ *--> / && msg {loc=$2; gsub(/\\/,"/",loc); n=split(loc,a,":"); printf "::error file=agent/%s,line=%s::%s\n", a[1], a[2], substr(msg,1,300); msg=""}' test.log | head -10
            grep -E "^test .* FAILED$" test.log | head -5 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            grep -A1 "panicked at" test.log | grep -v '^--$' | paste -sd' ' | head -c 1500 | while IFS= read -r l; do echo "::error::${l}"; done
            grep -E "^(error|warning: unused)" test.log | sort -u | head -8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          exit $code
      - name: Compilation de publication (release)
        working-directory: agent
        run: cargo build --release

  docker:
    # L'image publiée à chaque version (ghcr.io) : on vérifie qu'elle se construit et démarre.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t corvus:ci .
      - name: Démarrage et contrôle de santé
        shell: bash
        run: |
          docker run -d --name corvus-ci corvus:ci
          for i in $(seq 1 30); do
            if docker exec corvus-ci wget -qO- http://127.0.0.1:7680/api/health >/dev/null 2>&1; then echo "Corvus répond (essai $i)"; exit 0; fi
            sleep 1
          done
          docker logs corvus-ci
          echo "::error::l'image Docker ne répond pas sur /api/health"
          exit 1
