# Drop-in systemd : active la PRÉVISUALISATION de commandes (étape 5.2) sur cet hôte.
#   sudo mkdir -p /etc/systemd/system/corvus-agent.service.d
#   sudo cp deploy/agent/corvus-agent-preview.conf /etc/systemd/system/corvus-agent.service.d/preview.conf
#   sudo systemctl daemon-reload && sudo systemctl restart corvus-agent
#
# Pourquoi ces droits : l'agent doit créer des espaces de noms (montage, PID, réseau), monter un OverlayFS,
# faire un chroot et abandonner des capacités avant d'exécuter la commande. Ils restent limités aux
# opérations de préparation du bac à sable ; la commande elle-même tourne SANS ces capacités, sans réseau.
# CAP_SETUID / CAP_SETGID sont aussi AMBIANTES : sans cela le processus n'a pas CAP_SETUID de façon effective et la
# prévisualisation « en tant qu'un utilisateur » échoue (setpriv : « setresuid failed: Operation not permitted »).
# Contrepartie honnête : tant que ce drop-in est actif, l'agent est plus puissant (CAP_SYS_ADMIN) ;
# ne l'activez que sur les hôtes où vous voulez la prévisualisation.
[Service]
ExecStart=
ExecStart=/usr/local/bin/corvus-agent run --allow-preview
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_CHROOT CAP_MKNOD CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_KILL
AmbientCapabilities=CAP_SETUID CAP_SETGID
ProtectSystem=no
RestrictNamespaces=no
MemoryDenyWriteExecute=no
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
